name: Elliott Wave alertas
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ew
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python ew_bot.py --once
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          MARKET: spot
      - name: Guardar estado
        run: |
          git config user.name "ew-bot"
          git config user.email "ew-bot@users.noreply.github.com"
          git add ew_state.json || true
          git diff --cached --quiet || (git commit -m "estado" && git push)
