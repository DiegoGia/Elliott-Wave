name: Elliott Wave alertas
on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos (el minimo que permite GitHub)
  workflow_dispatch:         # permite correrlo a mano
permissions:
  contents: write            # para guardar ew_state.json
concurrency:
  group: ew
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python ew_bot.py --once
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          MARKET: spot
      - name: Guardar estado
        run: |
          git config user.name "ew-bot"
          git config user.email "ew-bot@users.noreply.github.com"
          git add ew_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "estado"
            for i in 1 2 3 4; do
              if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
                exit 0
              fi
              echo "Reintento $i de guardar estado..."
              sleep $((i * 4))
            done
            echo "No se pudo guardar el estado"
            exit 1
          fi
